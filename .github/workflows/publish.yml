name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Require matching release and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Check format and lint
        run: npm run check

      - name: Typecheck, lint, and test
        run: npm run verify

      - name: Smoke-load package in Pi
        run: ./node_modules/.bin/pi -e . --list-models

      - name: Require an OIDC-capable npm CLI
        run: |
          npm_version="$(npm --version)"
          test "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" = "11.5.1"

      - name: Publish to npm
        run: npm publish
