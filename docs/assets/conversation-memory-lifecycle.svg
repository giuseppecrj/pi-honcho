<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Pi Honcho conversation memory lifecycle</title>
  <desc id="description">Four stages show Pi starting a repository memory session, fetching cached recall, applying memory on every turn, and asynchronously storing completed exchanges. A safety band explains what is not synchronized and when pending delivery is flushed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.52" stop-color="#101221"/>
      <stop offset="1" stop-color="#170d18"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#a68cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a68cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow">
      <stop offset="0" stop-color="#ff7468" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8b75"/>
      <stop offset="0.5" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#a991ff"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d9b4"/>
      <stop offset="0.5" stop-color="#ffbd78"/>
      <stop offset="1" stop-color="#a990ff"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L10 6L1 11Z" fill="#c7b4ff"/>
    </marker>
    <clipPath id="frame"><rect width="1600" height="1000" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="1000" fill="url(#background)"/>
    <rect width="1600" height="1000" fill="url(#grid)"/>
    <circle cx="1370" cy="120" r="520" fill="url(#violetGlow)"/>
    <circle cx="1240" cy="930" r="510" fill="url(#coralGlow)"/>

    <g transform="translate(76 60)">
      <rect width="232" height="44" rx="22" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="25" cy="22" r="5" fill="#69dfb8" filter="url(#glow)"/>
      <text x="43" y="28" fill="#d8ddd9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">PI HONCHO</text>
    </g>
    <text x="1524" y="89" text-anchor="end" fill="#8d94a6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.6">CONVERSATION MEMORY</text>

    <text x="76" y="178" fill="#f5f4ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="760" letter-spacing="-2">Memory lifecycle</text>
    <text x="78" y="228" fill="#a7adbb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Recall once · apply every turn · store after completion</text>

    <g transform="translate(78 274)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">
      <rect width="150" height="38" rx="12" fill="#64d9b4" fill-opacity="0.09" stroke="#64d9b4" stroke-opacity="0.34"/>
      <text x="75" y="25" text-anchor="middle" fill="#8ae6c7">PI</text>
      <path d="M165 19H232" stroke="#697184" stroke-width="2" stroke-dasharray="4 7"/>
      <rect x="247" width="190" height="38" rx="12" fill="#ffbd78" fill-opacity="0.08" stroke="#ffbd78" stroke-opacity="0.32"/>
      <text x="342" y="25" text-anchor="middle" fill="#ffd197">LOCAL LEDGER</text>
      <path d="M452 19H519" stroke="#697184" stroke-width="2" stroke-dasharray="4 7"/>
      <rect x="534" width="170" height="38" rx="12" fill="#a990ff" fill-opacity="0.09" stroke="#a990ff" stroke-opacity="0.34"/>
      <text x="619" y="25" text-anchor="middle" fill="#c2b2ff">HONCHO</text>
    </g>

    <!-- Flow thread -->
    <g fill="none" stroke="url(#flow)" stroke-width="3" stroke-opacity="0.74" marker-end="url(#arrow)">
      <path d="M402 527H432"/>
      <path d="M784 527H814"/>
      <path d="M1166 527H1196"/>
    </g>

    <!-- Step 1 -->
    <g transform="translate(62 352)" filter="url(#shadow)">
      <rect width="330" height="350" rx="24" fill="#0b1119" fill-opacity="0.96" stroke="#64d9b4" stroke-opacity="0.35"/>
      <circle cx="44" cy="50" r="23" fill="#64d9b4" fill-opacity="0.13" stroke="#64d9b4" stroke-opacity="0.42"/>
      <text x="44" y="58" text-anchor="middle" fill="#8ae6c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">1</text>
      <text x="82" y="46" fill="#8ae6c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">SESSION START</text>
      <text x="82" y="70" fill="#f0f1ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Resolve</text>
      <path d="M28 99H302" stroke="#ffffff" stroke-opacity="0.08"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">
        <circle cx="37" cy="136" r="4" fill="#64d9b4"/><text x="53" y="142" fill="#c9cdd4">Apply project policy</text>
        <circle cx="37" cy="180" r="4" fill="#64d9b4"/><text x="53" y="186" fill="#c9cdd4">Open repository session</text>
        <circle cx="37" cy="224" r="4" fill="#64d9b4"/><text x="53" y="230" fill="#c9cdd4">Reconcile pending writes</text>
      </g>
      <rect x="28" y="275" width="274" height="46" rx="13" fill="#64d9b4" fill-opacity="0.07" stroke="#64d9b4" stroke-opacity="0.2"/>
      <text x="165" y="304" text-anchor="middle" fill="#86b8aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">non-blocking startup</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(444 352)" filter="url(#shadow)">
      <rect width="330" height="350" rx="24" fill="#11111a" fill-opacity="0.96" stroke="#ffbd78" stroke-opacity="0.34"/>
      <circle cx="44" cy="50" r="23" fill="#ffbd78" fill-opacity="0.12" stroke="#ffbd78" stroke-opacity="0.4"/>
      <text x="44" y="58" text-anchor="middle" fill="#ffd197" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">2</text>
      <text x="82" y="46" fill="#ffd197" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">ONCE PER SESSION</text>
      <text x="82" y="70" fill="#f0f1ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Recall</text>
      <path d="M28 99H302" stroke="#ffffff" stroke-opacity="0.08"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">
        <circle cx="37" cy="136" r="4" fill="#ffbd78"/><text x="53" y="142" fill="#c9cdd4">Fetch project summary</text>
        <circle cx="37" cy="180" r="4" fill="#ffbd78"/><text x="53" y="186" fill="#c9cdd4">Fetch user context</text>
        <circle cx="37" cy="224" r="4" fill="#ffbd78"/><text x="53" y="230" fill="#c9cdd4">Cache in this Pi process</text>
      </g>
      <rect x="28" y="275" width="274" height="46" rx="13" fill="#ffbd78" fill-opacity="0.07" stroke="#ffbd78" stroke-opacity="0.2"/>
      <text x="165" y="304" text-anchor="middle" fill="#c5a47b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">bounded remote context</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(826 352)" filter="url(#shadow)">
      <rect width="330" height="350" rx="24" fill="#12111c" fill-opacity="0.96" stroke="#a990ff" stroke-opacity="0.4"/>
      <circle cx="44" cy="50" r="23" fill="#a990ff" fill-opacity="0.13" stroke="#a990ff" stroke-opacity="0.44"/>
      <text x="44" y="58" text-anchor="middle" fill="#c2b2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">3</text>
      <text x="82" y="46" fill="#c2b2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">EVERY TURN</text>
      <text x="82" y="70" fill="#f0f1ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Apply</text>
      <path d="M28 99H302" stroke="#ffffff" stroke-opacity="0.08"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">
        <circle cx="37" cy="136" r="4" fill="#a990ff"/><text x="53" y="142" fill="#c9cdd4">Inject cached memory</text>
        <circle cx="37" cy="180" r="4" fill="#a990ff"/><text x="53" y="186" fill="#c9cdd4">Run model and tools</text>
        <circle cx="37" cy="224" r="4" fill="#a990ff"/><text x="53" y="230" fill="#c9cdd4">Complete assistant text</text>
      </g>
      <rect x="28" y="275" width="274" height="46" rx="13" fill="#a990ff" fill-opacity="0.08" stroke="#a990ff" stroke-opacity="0.22"/>
      <text x="165" y="304" text-anchor="middle" fill="#a89aca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">no per-turn fetch</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(1208 352)" filter="url(#shadow)">
      <rect width="330" height="350" rx="24" fill="#161118" fill-opacity="0.96" stroke="#ff7b6e" stroke-opacity="0.38"/>
      <circle cx="44" cy="50" r="23" fill="#ff7b6e" fill-opacity="0.12" stroke="#ff7b6e" stroke-opacity="0.42"/>
      <text x="44" y="58" text-anchor="middle" fill="#ff9b90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">4</text>
      <text x="82" y="46" fill="#ff9b90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">AFTER EACH TURN</text>
      <text x="82" y="70" fill="#f0f1ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Store</text>
      <path d="M28 99H302" stroke="#ffffff" stroke-opacity="0.08"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">
        <circle cx="37" cy="136" r="4" fill="#ff7b6e"/><text x="53" y="142" fill="#c9cdd4">Scan complete exchange</text>
        <circle cx="37" cy="180" r="4" fill="#ff7b6e"/><text x="53" y="186" fill="#c9cdd4">Queue in local ledger</text>
        <circle cx="37" cy="224" r="4" fill="#ff7b6e"/><text x="53" y="230" fill="#c9cdd4">Deliver and acknowledge</text>
      </g>
      <rect x="28" y="275" width="274" height="46" rx="13" fill="#ff7b6e" fill-opacity="0.07" stroke="#ff7b6e" stroke-opacity="0.2"/>
      <text x="165" y="304" text-anchor="middle" fill="#c38d89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">async · ordered · retryable</text>
    </g>

    <!-- Safety and lifecycle boundaries -->
    <g transform="translate(62 758)">
      <rect width="1476" height="164" rx="24" fill="#0a0d14" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.11"/>
      <g transform="translate(30 28)">
        <circle cx="14" cy="14" r="8" fill="#ff7b6e" fill-opacity="0.18" stroke="#ff7b6e" stroke-opacity="0.55"/>
        <path d="M10 10L18 18M18 10L10 18" stroke="#ff9b90" stroke-width="2"/>
        <text x="38" y="20" fill="#f1d0cc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.3">NOT SYNCED</text>
        <text x="38" y="52" fill="#979dac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Secrets · incomplete turns · tool output · source files · images · thinking</text>
      </g>
      <path d="M738 24V140" stroke="#ffffff" stroke-opacity="0.09"/>
      <g transform="translate(776 28)">
        <circle cx="14" cy="14" r="8" fill="#64d9b4" fill-opacity="0.18" stroke="#64d9b4" stroke-opacity="0.55"/>
        <path d="M10 14L13 17L19 10" fill="none" stroke="#8ae6c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="20" fill="#cae5dd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.3">FLUSH BOUNDARIES</text>
        <text x="38" y="52" fill="#979dac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Compact · switch · fork · shutdown</text>
        <text x="38" y="88" fill="#747b8b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">offline or uncertain → keep pending for recovery</text>
      </g>
    </g>

    <text x="78" y="966" fill="#71788a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">privacy-aware · future-session memory · local-first reliability</text>
    <text x="1522" y="966" text-anchor="end" fill="#71788a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">npm:pi-honcho</text>
  </g>
  <rect x="1" y="1" width="1598" height="998" rx="33" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
